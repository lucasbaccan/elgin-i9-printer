root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/elgin-print ."
  entrypoint = ["./tmp/elgin-print", "serve"]
  include_ext = ["go", "html", "txt", "json"]
  exclude_regex = ["_test\\.go$"]
  exclude_dir = ["tmp", "docs", "deploy", ".git", ".github"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true
