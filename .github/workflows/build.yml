name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile (static linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/elgin-print-linux-amd64 .

      - name: Cross-compile (windows/amd64)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/elgin-print-windows-amd64.exe .

      - name: Upload artifact (linux/amd64)
        uses: actions/upload-artifact@v4
        with:
          name: elgin-print-linux-amd64
          path: dist/elgin-print-linux-amd64

      - name: Upload artifact (windows/amd64)
        uses: actions/upload-artifact@v4
        with:
          name: elgin-print-windows-amd64
          path: dist/elgin-print-windows-amd64.exe
